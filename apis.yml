aid: joopiter
name: Joopiter
description: >-
  Joopiter (stylized JOOPITER) is a digital-first auction house and marketplace
  founded by Pharrell Williams for rare objects and culturally significant
  collectibles. The platform hosts timed online auctions, a curated marketplace,
  and private sales spanning watches, sneakers, streetwear, art, jewelry, and
  memorabilia, pairing commerce with editorial storytelling about each object
  and its provenance. Joopiter offers consignment and "sell with Joopiter"
  services connecting collectors and creators globally. It is a consumer-facing
  luxury commerce brand; as of this writing it publishes no public developer
  program, API, or documentation surface, so this API Evangelist profile is an
  identity record rather than a technical/API catalog entry.
